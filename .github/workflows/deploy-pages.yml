name: Deploy Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to inject into the build, for example v1.2.3
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release version
        id: release-version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG:-$MANUAL_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION="$(bun -e "console.log(require('./package.json').version)")"
          fi

          PACKAGE_VERSION="${VERSION#v}"
          PACKAGE_VERSION="$PACKAGE_VERSION" bun -e "const fs = require('node:fs'); const packagePath = 'package.json'; const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8')); pkg.version = process.env.PACKAGE_VERSION; fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name rpy-tool --branch ${{ github.event.repository.default_branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
